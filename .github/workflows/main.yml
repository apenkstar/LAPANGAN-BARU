name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Buat proyek Android
        run: npx cap add android

      - name: Buat ikon
        continue-on-error: true
        run: |
          pip install pillow
          python3 scripts/make_icons.py
          npx --yes @capacitor/assets@3.0.5 generate --android

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Pakai kunci tanda tangan tetap
        run: |
          mkdir -p ~/.android
          base64 -d signing/debug.keystore.b64 > ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Siapkan file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kas-lapangan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kas-lapangan-apk
          path: kas-lapangan.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kas Lapangan v1.0.${{ github.run_number }}
          make_latest: true
          files: kas-lapangan.apk
